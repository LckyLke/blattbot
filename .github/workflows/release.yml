name: Release

# Cut a release with `npm run release -- <version>` (bumps the version, dates
# the CHANGELOG section, commits and tags locally), then push the commit and
# the tag:
#   git push origin main v0.4.2
# The tag must match server/package.json's version and CHANGELOG.md must have
# a "## <version>" section (its body becomes the release notes). This runs the
# full CI workflow (every OS, the minimum Node, the packaging smoke test and
# the browser checks), builds the npm tarball with release:pack, and publishes
# a GitHub Release with the tarball attached. Publishing to npm stays a manual
# step:
#   npm publish blattbot-<version>.tgz

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Cheap checks first, so a mistyped tag fails before the full matrix runs.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Tag must match the package version
        run: |
          pkg=$(node -p "require('./server/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag is v$tag but server/package.json says $pkg" >&2
            exit 1
          fi

      - name: CHANGELOG.md must have a section for this version
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - run: npm run release:pack

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          case "$GITHUB_REF_NAME" in *-*) extra="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" blattbot-*.tgz \
            --title "BlattBot ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md $extra
